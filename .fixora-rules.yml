rules:
- id: fixora-wrapper-check
  patterns:
  - pattern-inside: "def check(...):\n  ..."
  - pattern-either:
    - pattern: request.form.get(...)
    - pattern: $OBJ.get(...)
    - pattern: get(...)
    - pattern: render_template(...)
    - pattern: $OBJ.render_template(...)
  message: '### Missing Authentication via `request.form.get("email")`


    **Vulnerable Sink:** Passes untrusted data directly to `request.form.get, render_template`.


    **Live Exploit Vector:**

    ```python\n// Target Function: check()\n// Parameter: request.form.get("email")\n\n//
    Attacker executes:\ncheck(request.form.get("email") = attacker@example.com)\n```


    **Outcome:**

    An attacker can submit a request with any email address, potentially accessing
    another user''s emails.


    **Data at Risk (Impact):**

    Attackers can access and read emails of other users, potentially leading to sensitive
    information disclosure.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Missing Authentication
    confidence: HIGH
    wrapper_defined_in: app.py
    wraps:
    - request.form.get
    - render_template
    modules_used:
    - flask
    vulnerable_parameter: request.form.get("email")
    malicious_payload: attacker@example.com
    exploit_explanation: An attacker can submit a request with any email address,
      potentially accessing another user's emails.
    exploit_injected_example: check(request.form.get("email") = attacker@example.com)
    impact_summary: Attackers can access and read emails of other users, potentially
      leading to sensitive information disclosure.
    cwe: &id001
    - CWE-306
    owasp: &id002
    - A01:2021
- id: fixora-wrapper-authenticate-gmail
  patterns:
  - pattern-inside: "def authenticate_gmail(...):\n  ..."
  - pattern-either:
    - pattern: os.path.exists(...)
    - pattern: $OBJ.exists(...)
    - pattern: exists(...)
    - pattern: Credentials.from_authorized_user_file(...)
    - pattern: $OBJ.from_authorized_user_file(...)
    - pattern: from_authorized_user_file(...)
    - pattern: os.getenv(...)
    - pattern: $OBJ.getenv(...)
    - pattern: getenv(...)
    - pattern: InstalledAppFlow.from_client_config(...)
    - pattern: $OBJ.from_client_config(...)
    - pattern: from_client_config(...)
    - pattern: flow.run_console(...)
    - pattern: $OBJ.run_console(...)
    - pattern: run_console(...)
    - pattern: open(...)
    - pattern: $OBJ.open(...)
    - pattern: creds.to_json(...)
    - pattern: $OBJ.to_json(...)
    - pattern: to_json(...)
  message: '### Missing Authentication via `user_email`


    **Vulnerable Sink:** Passes untrusted data directly to `os.path.exists, Credentials.from_authorized_user_file,
    os.getenv, InstalledAppFlow.from_client_config, flow.run_console, open, creds.to_json`.


    **Live Exploit Vector:**

    ```python\n// Target Function: authenticate_gmail()\n// Parameter: user_email\n\n//
    Attacker executes:\nauthenticate_gmail(user_email = attacker@example.com)\n```


    **Outcome:**

    An attacker can pass any email address to the function, potentially accessing
    another user''s credentials.


    **Data at Risk (Impact):**

    Attackers can access and read emails of other users, potentially leading to sensitive
    information disclosure.'
  severity: ERROR
  languages:
  - python
  metadata:
    category: security
    technology:
    - python
    source: fixora-ai-analysis
    vulnerability_type: Missing Authentication
    confidence: HIGH
    wrapper_defined_in: app.py
    wraps:
    - os.path.exists
    - Credentials.from_authorized_user_file
    - os.getenv
    - InstalledAppFlow.from_client_config
    - flow.run_console
    - open
    - creds.to_json
    modules_used:
    - google
    - builtins
    - google_auth_oauthlib
    - googleapiclient
    - os
    vulnerable_parameter: user_email
    malicious_payload: attacker@example.com
    exploit_explanation: An attacker can pass any email address to the function, potentially
      accessing another user's credentials.
    exploit_injected_example: authenticate_gmail(user_email = attacker@example.com)
    impact_summary: Attackers can access and read emails of other users, potentially
      leading to sensitive information disclosure.
    cwe: *id001
    owasp: *id002
